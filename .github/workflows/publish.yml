name: Publish

# Triggered by a published GitHub Release so the `pypi` environment's protection
# rules gate the deploy. workflow_dispatch is the recovery path for a release
# whose upload never ran:
#
#   gh workflow run publish.yml -f tag=v1.2.3
#
# Run it from the default branch and pass the tag as an input, not as --ref:
# older tags have no workflow_dispatch trigger. The checkout below uses the input.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v1.1.0b6"
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Always build from the tag itself, so a dispatch started from the wrong ref
          # cannot upload main under the tag's version.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.13"
          # Release artifacts must never be built from a shared cache
          # (zizmor: cache-poisoning).
          enable-cache: false
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcpscore
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  attach-artifacts:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      - name: Attach artifacts to the GitHub release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
