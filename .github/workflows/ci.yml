name: CI

on:
  push:
    # Every branch, so a branch pushed without an open PR is still checked.
    # Without this a merged-then-reused branch can reach a release unverified.
    branches: ['**']
  # Jobs run on pull_request only for fork PRs: a same-repo PR already gets the
  # push run's checks on its head commit, and a second run doubles the jobs.
  pull_request:
    branches: [main]

concurrency:
  # Group by event, head repo and branch: a push run and a pull_request run of the
  # same commit must not cancel each other (a cancelled run shows as a failed check),
  # and a fork branch named like ours must not collide with ours.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.head.repo.full_name || github.repository }}-${{
    github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  npm-wrapper:
    name: npm wrapper / ${{ matrix.os }} / node${{ matrix.node-version }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["22.23.3"]
        include:
          # Compatibility coverage for the declared minimum major version.
          - os: ubuntu-latest
            node-version: "18.20.8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm --prefix npm test

  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The ruff hooks run the venv's ruff (see .pre-commit-config.yaml), so the
      # job needs the synced project, not a standalone pre-commit action.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: make precommit

  typecheck:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --all-groups
      - run: uv run pyright mcpscore/ scripts/

  test:
    name: Test / ${{ matrix.os }} / py${{ matrix.python-version }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups
      - run: uv run pytest --cov --cov-report=xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  workflow-security:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.13"
      - name: Audit workflows with zizmor
        # Pinned so new zizmor audits can't fail PRs on unchanged code; the canary
        # workflow runs the latest zizmor to surface new findings on a schedule.
        run: uvx zizmor==1.30.1 --no-progress .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
