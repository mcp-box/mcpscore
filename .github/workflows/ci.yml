name: CI

on:
  push:
    # Every branch, so a branch pushed without an open PR is still checked.
    # Without this a merged-then-reused branch can reach a release unverified.
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  # Keyed by event, then head repo, then branch.
  #   event_name: a push run and its pull_request run must NOT share a group.
  #     They report onto the same PR, so cancelling one renders as a FAILED
  #     check and blocks merge even though CI passed.
  #   head repo: without it a fork PR whose head branch is named `main` (or two
  #     forks sharing a branch name) collides with an unrelated run.
  #   branch: consecutive pushes to one branch still supersede each other.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.head.repo.full_name || github.repository }}-${{
    github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The ruff hooks run the venv's ruff (see .pre-commit-config.yaml), so the
      # job needs the synced project, not a standalone pre-commit action.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: make precommit

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --all-groups
      - run: uv run pyright mcpscore/ scripts/

  test:
    name: Test / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups
      - run: uv run pytest --cov --cov-report=xml
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  workflow-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.13"
      - name: Audit workflows with zizmor
        # Pinned so new zizmor audits can't fail PRs on unchanged code; the canary
        # workflow runs the latest zizmor to surface new findings on a schedule.
        run: uvx zizmor==1.27.0 --no-progress .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
