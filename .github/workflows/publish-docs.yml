name: Publish docs

# docs.mcpscore.dev must describe the RELEASED engine, not main: main's docs
# can document rules no released version emits (they merge ahead of the
# release train). This workflow keeps a `docs-live` branch fast-forwarded to
# the docs of the latest release tag; the Mintlify GitHub App is configured
# (in the Mintlify dashboard) to deploy from `docs-live` instead of main.
#
# Runs on every published release (the same trigger as the PyPI/npm publish
# workflows) and on demand with an explicit tag. Pre-releases are skipped:
# their docs go live with the stable release that follows.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to publish docs from (e.g. v1.9.0)"
        required: true
        type: string

permissions: {}

# One publisher at a time: without this, two releases in quick succession can
# race and the older run's force-push can finish last, moving docs-live
# backward. cancel-in-progress stays false — a running publish finishes, the
# queued one then re-checks what "latest" is.
concurrency:
  group: docs-live-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # A release run carries its tag; a manual run must name one explicitly —
      # github.ref is deliberately NOT a fallback, because a dispatch from a
      # branch would otherwise publish unreleased content to docs-live.
      DOCS_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Refuse anything but a stable release tag
        run: |
          [[ "$DOCS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'$DOCS_TAG' is not a stable release tag (vX.Y.Z) — refusing to publish docs from it"
            exit 1
          }
      - name: Refuse anything but the latest stable release
        # docs-live promises "the docs of the latest stable release" — a
        # dispatch of an older (but valid) tag, or a stale queued release run,
        # must not move it backward. releases/latest excludes pre-releases and
        # drafts, so equality with it is exactly that promise.
        run: |
          LATEST="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          [[ "$DOCS_TAG" == "$LATEST" ]] || {
            echo "::error::'$DOCS_TAG' is not the latest stable release ('$LATEST') — refusing to move docs-live backward"
            exit 1
          }
      # persist-credentials stays on deliberately: this job's entire purpose
      # is the authenticated push below, and nothing after checkout uploads
      # artifacts that could leak the persisted token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1  # zizmor: ignore[artipacked]
        with:
          # refs/tags/ pins the checkout to the tag namespace: a branch that
          # happens to share the name cannot be substituted.
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Point docs-live at this release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Force: docs-live is a deploy pointer owned by this workflow, never
          # a place where commits originate — rewriting it is the contract.
          git push origin "HEAD:refs/heads/docs-live" --force
