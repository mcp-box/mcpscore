name: Publish npm

# Publishes the npm wrapper (npm/) with OIDC Trusted Publishing + provenance.
# Fires on a published GitHub Release (same event as the PyPI publish.yml, so
# `make release` ships both registries), plus manual dispatch as a fallback.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v1.1.0"
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # PyPI pre-releases (PEP 440 versions like 1.1.0b1) are not valid npm
    # semver and ship without the npm wrapper — skip npm for GitHub Releases
    # marked "pre-release". Manual dispatch still always publishes.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Publish the tag's wrapper, never main's: a dispatch defaults to the ref it
          # started from, and npm publishes are immutable.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      # No dependency caching is enabled (the `cache:` input is omitted), so
      # there is no cache to poison; the publish is OIDC + provenance built
      # from the checked-out release source.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          # Exact patch: this is the release path, so the runtime it publishes
          # from must not drift between an approved change and the actual run.
          node-version: "22.23.2"
          registry-url: "https://registry.npmjs.org"
      # OIDC Trusted Publishing needs npm >= 11.5.1; Node 22 bundles 10.x. Exact pin
      # of the official npm package, no lockfile needed.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11.18.0  # zizmor: ignore[adhoc-packages]
      # The wrapper only launches `mcpscore==<pythonVersion>` through uvx/pipx, so the
      # Python release must be resolvable before this publishes (both workflows fire on
      # the same release event, unordered). Validate the tag, not package.json: a
      # pre-release tag ships PyPI-only and the manifest still carries the previous stable.
      - name: Reject pre-release tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tag '${RELEASE_TAG}' is not a plain semver release — pre-releases ship PyPI-only"
            exit 1
          fi
          manifest="$(node -p 'require("./npm/package.json").version')"
          if [ "$manifest" != "$version" ]; then
            echo "::error::npm/package.json is ${manifest} but the tag is ${version} — refusing to publish a mismatched wrapper"
            exit 1
          fi
          # `pythonVersion` decides which CLI the wrapper runs; a stale pin would publish a
          # new npm version that launches an old CLI, immutably. scripts/release.py checks
          # the same pair at preflight; this covers releases not cut through it.
          pinned="$(node -p 'require("./npm/package.json").mcpscore.pythonVersion')"
          if [ "$pinned" != "$version" ]; then
            echo "::error::npm wrapper pins mcpscore==${pinned} but the tag is ${version} — it would launch the wrong CLI"
            exit 1
          fi
          echo "tag ${RELEASE_TAG}, manifest ${manifest} and python pin ${pinned} all agree"
      # Reuses the poll from scripts/release.py: the simple index, which uv and pip
      # resolve against, goes green after the JSON metadata endpoint does.
      - name: Wait for the pinned version on the PyPI simple index
        run: |
          set -euo pipefail
          version="$(node -p 'require("./npm/package.json").mcpscore.pythonVersion')"
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from release import wait_for_pypi_index
          wait_for_pypi_index('${version}')
          "
      - name: Publish with provenance
        working-directory: npm
        run: npm publish --access public --provenance
