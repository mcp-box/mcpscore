name: Publish npm

# Publishes the npm wrapper (npm/) with OIDC Trusted Publishing + provenance.
# Fires on a published GitHub Release (same event as the PyPI publish.yml, so
# `make release` ships both registries), plus manual dispatch as a fallback.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v1.1.0"
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # PyPI pre-releases (PEP 440 versions like 1.1.0b1) are not valid npm
    # semver and ship without the npm wrapper — skip npm for GitHub Releases
    # marked "pre-release". Manual dispatch still always publishes.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Publish the tag's wrapper, never whatever `main` happens to hold.
          # A dispatch defaults to the ref it was started from, so without this
          # a recovery run would push main's npm/ to the registry under the
          # release's version — and npm publishes are immutable.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      # No dependency caching is enabled (the `cache:` input is omitted), so
      # there is no cache to poison; the publish is OIDC + provenance built
      # from the checked-out release source.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          # Exact patch: this is the release path, so the runtime it publishes
          # from must not drift between an approved change and the actual run.
          node-version: "22.23.2"
          registry-url: "https://registry.npmjs.org"
      # Node 22 bundles npm 10.x, but OIDC Trusted Publishing needs npm >=
      # 11.5.1. Without it, npm authenticates with setup-node's placeholder
      # token and the registry rejects the publish with E404. Exact-pinned
      # official npm package — deterministic, no lockfile to install from.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11.18.0  # zizmor: ignore[adhoc-packages]
      # The wrapper is a launcher, not a Node implementation: it runs
      # `mcpscore==<pythonVersion>` through uvx/pipx. Publishing before that
      # version is resolvable on PyPI ships a package that cannot run — and npm
      # publishes are immutable. Both workflows fire on the same release event
      # with no ordering between them, so wait here rather than assume.
      # A PEP 440 pre-release (1.6.0b1) is not valid npm semver and ships
      # PyPI-only. The `if:` above lets a manual dispatch through
      # unconditionally so a failed release can be recovered, so the check has
      # to live here.
      #
      # It validates the TAG, not npm/package.json: `_run_preflight` in
      # scripts/release.py deliberately skips npm version sync for
      # pre-releases, so on a pre-release tag the manifest still carries the
      # PREVIOUS stable version and would pass a manifest check while the run
      # republishes the wrong version.
      - name: Reject pre-release tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tag '${RELEASE_TAG}' is not a plain semver release — pre-releases ship PyPI-only"
            exit 1
          fi
          manifest="$(node -p 'require("./npm/package.json").version')"
          if [ "$manifest" != "$version" ]; then
            echo "::error::npm/package.json is ${manifest} but the tag is ${version} — refusing to publish a mismatched wrapper"
            exit 1
          fi
          echo "tag ${RELEASE_TAG} and manifest ${manifest} agree"
      # Reuses scripts/release.py rather than reimplementing the poll. That
      # function exists because `/pypi/<pkg>/<version>/json` goes green BEFORE
      # the simple index, and the simple index is what uv and pip resolve
      # against — waiting on the metadata endpoint is what made 1.1.1 report a
      # published release that could not be installed. A second copy here would
      # be free to drift back into that bug.
      - name: Wait for the pinned version on the PyPI simple index
        run: |
          set -euo pipefail
          version="$(node -p 'require("./npm/package.json").mcpscore.pythonVersion')"
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from release import wait_for_pypi_index
          wait_for_pypi_index('${version}')
          "
      - name: Publish with provenance
        working-directory: npm
        run: npm publish --access public --provenance
