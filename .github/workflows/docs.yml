name: Docs

# Deployment is handled by the Mintlify GitHub App (serves the docs/ directory
# on pushes to main). This workflow only validates: the generated rules
# reference must match the rule registry, and the site must have no broken links.
on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/generate_rules_doc.py"
      - "mcpscore/rules/**"
      - "mcpscore/spec.py"
      - ".github/workflows/docs.yml"
  push:
    # Every branch, so a branch pushed without an open PR is still checked.
    # Without this a merged-then-reused branch can reach a release unverified.
    branches: ['**']
    paths:
      - "docs/**"
      - "scripts/generate_rules_doc.py"
      - "mcpscore/rules/**"
      - "mcpscore/spec.py"
  workflow_dispatch:

concurrency:
  # Keyed by event, then head repo, then branch.
  #   event_name: a push run and its pull_request run must NOT share a group.
  #     They report onto the same PR, so cancelling one renders as a FAILED
  #     check and blocks merge even though CI passed.
  #   head repo: without it a fork PR whose head branch is named `main` (or two
  #     forks sharing a branch name) collides with an unrelated run.
  #   branch: consecutive pushes to one branch still supersede each other.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.head.repo.full_name || github.repository }}-${{
    github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --all-groups
      - name: Rules reference must match the rule registry
        run: |
          uv run python scripts/generate_rules_doc.py
          git diff --exit-code docs/rules.mdx
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Check for broken links
        working-directory: docs
        run: npx --yes mint broken-links
