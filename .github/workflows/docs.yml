name: Docs

# Validation only: the rules reference must match the registry and the site must
# have no broken links. Deployment is the Mintlify app serving docs/ from the
# `docs-live` branch, which publish-docs.yml moves to each stable release.
on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/generate_rules_doc.py"
      - "mcpscore/rules/**"
      - "mcpscore/spec.py"
      - ".github/workflows/docs.yml"
  push:
    # Every branch, so a branch pushed without an open PR is still checked.
    # Without this a merged-then-reused branch can reach a release unverified.
    branches: ['**']
    paths:
      - "docs/**"
      - "scripts/generate_rules_doc.py"
      - "mcpscore/rules/**"
      - "mcpscore/spec.py"
  workflow_dispatch:

concurrency:
  # Group by event, head repo and branch: a push run and a pull_request run of the
  # same commit must not cancel each other (a cancelled run shows as a failed check),
  # and a fork branch named like ours must not collide with ours.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.head.repo.full_name || github.repository }}-${{
    github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: "3.13"
      - run: uv sync --all-groups
      - name: Rules reference must match the rule registry
        run: |
          uv run python scripts/generate_rules_doc.py
          git diff --exit-code docs/rules.mdx
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # Exact patch, not a floating major: an unchanged workflow should not
          # start running on a new runtime because GitHub refreshed its image.
          # Node 22 is LTS (Jod), in maintenance until 2027-04-30.
          node-version: "22.23.2"
      - name: Check for broken links
        working-directory: docs
        run: npx --yes mint broken-links
