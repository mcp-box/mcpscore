name: Canary

# Daily lanes against the newest resolvable dependencies, the mcp 2.x pre-releases
# (advisory), and the latest zizmor, so upstream breakage and new workflow audits
# surface here instead of on unrelated PRs.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-deps:
    name: Latest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: "3.13"
      - name: Upgrade to newest resolvable dependencies
        run: uv sync --all-groups --upgrade
      - run: uv run pyright mcpscore/
      - run: uv run pytest -q

  zizmor-latest:
    name: Latest zizmor workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Audit workflows with the latest zizmor
        run: uvx zizmor --no-progress .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mcp-sdk-v2-beta:
    name: mcp SDK 2.x beta (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: "3.13"
      - run: uv sync --all-groups
      - name: Force the mcp 2.x pre-release
        run: uv pip install --prerelease=allow "mcp>=2.0.0b1"
      - name: Report installed mcp version
        run: uv run python -c "from importlib.metadata import version; print('mcp', version('mcp'))"
      - run: uv run pytest -q
