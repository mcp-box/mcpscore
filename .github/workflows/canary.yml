name: Canary

# Daily lanes against the newest resolvable dependencies, the mcp 2.x pre-releases
# (advisory), the latest zizmor and the latest Mintlify CLI, so upstream breakage and
# new workflow audits surface here instead of on unrelated PRs.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-deps:
    name: Latest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.13"
      - name: Upgrade to newest resolvable dependencies
        run: uv sync --all-groups --upgrade
      - run: uv run pyright mcpscore/
      - run: uv run pytest -q

  zizmor-latest:
    name: Latest zizmor workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Audit workflows with the latest zizmor
        run: uvx zizmor --no-progress .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mint-latest:
    name: Latest Mintlify broken-links check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.3"
      - name: Check for broken links with the latest mint
        working-directory: docs
        run: npx --yes mint broken-links

  mcp-sdk-v2-beta:
    name: mcp SDK 2.x beta (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.13"
      - run: uv sync --all-groups
      - name: Force the mcp 2.x pre-release
        run: uv pip install --prerelease=allow "mcp>=2.0.0b1"
      - name: Report installed mcp version
        run: uv run python -c "from importlib.metadata import version; print('mcp', version('mcp'))"
      - run: uv run pytest -q
