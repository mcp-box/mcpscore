repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # ruff runs from the project venv, so the hook, `make lint`, and CI all use
  # the one ruff that uv.lock pins. A separate ruff-pre-commit rev was a second
  # copy of the version that Dependabot could not update.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        pass_filenames: false  # lint the project as `make lint` does; explicit paths bypass ruff's exclude
        types_or: [python, pyi, toml]  # still only when Python or ruff's config (pyproject) changed
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: false
        types_or: [python, pyi, toml]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli==2.4.1

  - repo: local
    hooks:
      - id: typecheck
        name: Type Check
        entry: uv run pyright mcpscore/
        language: system
        types: [python]
        pass_filenames: false
